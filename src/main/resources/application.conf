newspipe {
  feeds = []
  poll-interval-seconds = 300
  opencode {
    model = "opencode/muse-spark-1.3-contributor-free"
    timeout-seconds = 120
  }
  kafka {
    bootstrap-servers = "localhost:9092"
    raw-topic = "raw_rss"
  }
  bronze {
    path = "s3a://lakehouse/bronze/news"
  }
  spark {
    master = "local[*]"
  }
}

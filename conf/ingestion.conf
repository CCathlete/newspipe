# Ingestion pipeline configuration: RSS poll, Kafka publish, raw bronze append.
#
# External user configuration: this file lives outside src/ deliberately, so it
# is not part of the compiled artifact. Each pipeline locates conf/ by walking
# up from its working directory; see the ConfLoader CU in feat-8.
#
# Every key can be overridden by the process environment first, then by a .env
# file discovered by the same walk-up. Precedence is sys.env > .env > this file.
# NEWSPIPE_S3_* values match RUSTFS_* in pipeline_infra/variables.tf.
newspipe {
  poll-interval-seconds = 300

  kafka {
    bootstrap-servers = "localhost:9092"
    raw-topic = "raw_rss"
  }

  bronze {
    path = "s3a://lakehouse/bronze/news"
  }

  spark {
    master = "local[*]"
  }

  s3 {
    endpoint = "http://localhost:9000"
    # Single-host S3-compatible stores cannot answer virtual-host-style bucket
    # names over localhost, so path-style addressing is required.
    path-style-access = true
    access-key = "minioadmin"
    secret-key = "minioadminpassword"
    bucket = "lakehouse"
  }
}

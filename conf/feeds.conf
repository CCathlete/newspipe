# Shared feed sources, consumed by both pipeline trees.
#
# External user configuration: this file lives outside src/ deliberately, so it
# is not part of the compiled artifact. Each pipeline locates conf/ by walking
# up from its working directory; see the ConfLoader CU in feat-8.
#
# List additions only -- this file is merged underneath ingestion.conf and
# enrichment.conf, so a key defined in both of those wins over one here.
#
# Every URL below was verified HTTP 200 with the User-Agent RomeRssClient
# sends ("newspipe-scala/0.2"). Sources that answered 200 with an empty body,
# or 404, were dropped rather than carried as dead entries.
newspipe {
  feeds = [
    "https://news.google.com/rss/search?q=geopolitics&hl=en-US&gl=US&ceid=US:en",
    "https://news.google.com/rss/search?q=geopolitics+OR+%22foreign+policy%22+when:7d&hl=en-US&gl=US&ceid=US:en",
    "https://www.aljazeera.com/xml/rss/all.xml",
    "https://feeds.bbci.co.uk/news/world/rss.xml",
    "https://foreignpolicy.com/feed/",
    "https://thediplomat.com/feed/",
    "https://warontherocks.com/feed/",
    "https://www.crisisgroup.org/rss.xml",
    "https://www.defensenews.com/arc/outboundfeeds/rss/?outputType=xml",
    "https://www.rfi.fr/en/rss",
    "https://www.scmp.com/rss/91/feed"
  ]
}

newspipe {
  feeds = [
    "https://news.google.com/rss/search?q=geopolitics&hl=en-US&gl=US&ceid=US:en",
    "https://news.google.com/rss/search?q=geopolitics+OR+%22foreign+policy%22+when:7d&hl=en-US&gl=US&ceid=US:en",
    "https://www.aljazeera.com/xml/rss/all.xml",
    "https://feeds.bbci.co.uk/news/world/rss.xml",
    "https://foreignpolicy.com/feed/",
    "https://thediplomat.com/feed/",
    "https://warontherocks.com/feed/",
    "https://www.crisisgroup.org/rss.xml",
    "https://www.defensenews.com/arc/outboundfeeds/rss/?outputType=xml",
    "https://www.rfi.fr/en/rss",
    "https://www.scmp.com/rss/91/feed"
  ]
  poll-interval-seconds = 300
  kafka {
    bootstrap-servers = "localhost:9092"
    raw-topic = "raw_rss"
  }
  bronze {
    path = "s3a://lakehouse/bronze/news"
  }
  spark {
    master = "local[*]"
  }
}
